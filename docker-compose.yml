services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baggage
      POSTGRES_PASSWORD: baggage
      POSTGRES_DB: baggage_eval
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baggage -d baggage_eval"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      # check_port_connectivity passes only once port 5672 accepts connections
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., args: { SERVICE: api } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://baggage:baggage@postgres:5432/baggage_eval?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    build: { context: ., args: { SERVICE: worker } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://baggage:baggage@postgres:5432/baggage_eval?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      replicas: 2   # two workers share the queue

volumes:
  pgdata:
